<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Climate AR Camera Test</title>
<style>html,body{margin:0;background:#07110e;color:white;font-family:system-ui;height:100%}main{min-height:100%;display:grid;place-items:center;padding:22px;box-sizing:border-box}.card{width:min(620px,100%);background:#10211b;border:1px solid #284b3e;border-radius:22px;padding:20px;box-sizing:border-box}video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;border-radius:15px;margin:14px 0}button{width:100%;border:0;border-radius:12px;background:#42a574;color:white;font-weight:800;padding:14px}pre{white-space:pre-wrap;color:#b8d6ca;font-size:12px}</style></head>
<body><main><div class="card"><h1>Camera Test</h1><p>Halaman ini hanya mengecek permission kamera, tanpa MindAR atau model 3D.</p><video id="v" autoplay playsinline muted></video><button id="b">Buka Kamera Belakang</button><pre id="s"></pre></div></main>
<script>const s=document.querySelector('#s'),v=document.querySelector('#v');document.querySelector('#b').onclick=async()=>{s.textContent=`secureContext=${window.isSecureContext}\norigin=${location.origin}\n`;try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=st;s.textContent+='OK: kamera berhasil dibuka.'}catch(e){s.textContent+=`ERROR: ${e.name}: ${e.message}`}};</script></body></html>
